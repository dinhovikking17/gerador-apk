name: Gerar APK Rebrand

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome do App'
        required: true
      reseller_id:
        description: 'ID do Revendedor'
        required: true
      logo_b64:
        description: 'Logo Base64'
        required: false
      bg_b64:
        description: 'Fundo Base64'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar Dependências (Apktool, Zipalign, Java)
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zipalign openjdk-17-jdk imagemagick

      - name: Baixar APK Base
        run: |
          # Substitua este link pelo link direto para o download do seu APK original (sem modificações)
          curl -L -o base.apk "${{ secrets.URL_APK_BASE }}"

      - name: Descompilar APK
        run: |
          apktool d base.apk -o app_descompilado

      - name: Injetar ID do Revendedor
        run: |
          mkdir -p app_descompilado/assets
          echo -n "${{ github.event.inputs.reseller_id }}" > app_descompilado/assets/reseller_id.txt

      - name: Trocar Nome do Aplicativo
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          # Modifica o nome nas strings
          find app_descompilado/res -name "strings.xml" -exec sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" {} +

      - name: Injetar Logotipo (se fornecido)
        run: |
          if [ -n "${{ github.event.inputs.logo_b64 }}" ]; then
            echo "${{ github.event.inputs.logo_b64 }}" | base64 -d > nova_logo.png
            # Redimensiona para os tamanhos corretos do Android
            find app_descompilado/res -name "logo.png" -exec cp nova_logo.png {} +
            find app_descompilado/res -name "ic_launcher.png" -exec cp nova_logo.png {} +
          fi

      - name: Injetar Fundo (se fornecido)
        run: |
          if [ -n "${{ github.event.inputs.bg_b64 }}" ]; then
            echo "${{ github.event.inputs.bg_b64 }}" | base64 -d > novo_fundo.png
            find app_descompilado/res -name "fundo.png" -exec cp novo_fundo.png {} +
          fi

      - name: Recompilar APK
        run: |
          apktool b app_descompilado -o app_modificado.apk

      - name: Assinar APK
        run: |
          # Gera uma keystore temporária na hora para assinar
          keytool -genkey -v -keystore release.jks -alias alias -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=IPTV, OU=App, O=Rebrand, L=BR, S=BR, C=BR"
          zipalign -v -p 4 app_modificado.apk app_alinhado.apk
          apksigner sign --ks release.jks --ks-pass pass:123456 --key-pass pass:123456 --out app_final.apk app_alinhado.apk

      - name: Publicar Link de Download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-${{ github.event.inputs.reseller_id }}.apk
          path: app_final.apk
